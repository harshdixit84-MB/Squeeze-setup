name: Daily scan
on:
  schedule:
    - cron: "30 11 * * 1-5"      # 5:00 PM India time, after the market closes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backtest/requirements.txt
      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: data
          key: prices-v1-${{ github.run_id }}
          restore-keys: prices-v1-
      - name: Download latest prices from Angel One
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python backtest/fetch_data.py
      - name: Save prices for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: prices-v1-${{ github.run_id }}
      - name: Find today's matching stocks
        run: python backtest/scan_today.py
      - name: Find 20/50 EMA crossovers (green candle, today)
        run: python backtest/scan_ema_cross.py
      - name: Save results into the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add site/data
          git commit -m "Update today's candidates" || echo "Nothing new to save"
          git pull --rebase origin main
          git push
