name: Supertrend actions (remove / buy / sell)
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  act:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Remove Supertrend') ||
       startsWith(github.event.issue.title, 'Buy Supertrend') ||
       startsWith(github.event.issue.title, 'Sell Supertrend'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply the action
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          export TODAY=$(TZ=Asia/Kolkata date +%F)
          python3 backtest/st_actions.py
      - name: Save into the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add site/data/supertrend_list.json site/data/st_positions.json
          git commit -m "Supertrend action from issue" || echo "Nothing to save"
          git pull --rebase origin main
          git push
      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat /tmp/st_summary.md 2>/dev/null || echo "Something went wrong - see the workflow run."; echo; echo "The dashboard updates in about a minute."; } > /tmp/reply.md
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/reply.md
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
