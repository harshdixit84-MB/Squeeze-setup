name: Squeeze backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download NSE share prices from Angel One
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python backtest/fetch_data.py
      - name: Run the backtest
        run: python backtest/run_backtest.py
      - name: Save results into the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add site/data
          git commit -m "Update backtest results" || echo "Nothing new to save"
          git push
