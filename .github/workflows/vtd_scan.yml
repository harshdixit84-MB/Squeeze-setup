name: VTD 4H scan
on:
  schedule:
    - cron: "55 7 * * 1-5"       # 1:25 PM India time - the 09:15-13:15 four-hour candle has closed
    - cron: "10 10 * * 1-5"      # 3:40 PM India time - the 13:15-15:30 candle has closed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backtest/requirements.txt
      - name: Restore saved 1-hour prices
        uses: actions/cache/restore@v4
        with:
          path: data4h
          key: prices4h-v1-${{ github.run_id }}
          restore-keys: prices4h-v1-
      - name: Download latest 1-hour candles from Angel One
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python backtest/fetch_data_4h.py
      - name: Save prices for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data4h
          key: prices4h-v1-${{ github.run_id }}
      - name: Find VTD BUY signals on the 4-hour chart
        run: python backtest/scan_vtd.py
      - name: Save results into the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add site/data/vtd_list.json
          git commit -m "Update VTD 4H signals" || echo "Nothing new to save"
          git pull --rebase origin main
          git push
